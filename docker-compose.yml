# ============================================
# Web Security Lab Environment
# Docker Compose Configuration
# ============================================

services:

  # MySQL Database
  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=lab_password
      - MYSQL_DATABASE=testdb
    volumes:
      - ./testdb.sql:/docker-entrypoint-initdb.d/testdb.sql
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plab_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab-network

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8082:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=lab_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab-network

  # DVWA - Damn Vulnerable Web Application
  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=root
      - MYSQL_PASSWORD=lab_password
      - PHPIDS=0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab-network

  # Custom vulnerable web app (SQLi + XSS labs)
  web-labs:
    build:
      context: ./web-labs
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./web-labs/app:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab-network

volumes:
  db-data:

networks:
  lab-network:
    driver: bridge
